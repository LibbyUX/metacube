title: "CellxGene Census — Zoom"

axes:
  x:
    label: "Organism"
    column: "organism"
  y:
    label: "Assay"
    column: "assay"
    max_labels: 20
  z:
    label: "Tissue General"
    column: "tissue_general"
    max_labels: 30

size_colour: "count"
count_label: "cells"
axis_order: "cluster"

info_box:
  columns:
    dataset: "dataset_title"
    doi:     "collection_doi"

drilldown:
  type: "zoom"
  axes:
    z:
      label: "Tissue"
      column: "tissue"
      max_labels: 30
  treemap:
    # Concentration unit = dataset (one H5AD = dataset_id), labelled by title.
    category_column: "dataset_id"
    category_label_column: "dataset_title"
    subcategory_column: "cell_type"
    count_column: "count"
slice:
  fixed_axis: "x"
  count_column: "count"
